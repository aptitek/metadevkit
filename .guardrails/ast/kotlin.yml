# =============================================================================
# polyglot-guardrails — Kotlin 2.x Static AST Rules (lang:kotlin)
# Enforces Detekt Zero-Issue Purity, Coroutine Safety, and Null-Safety
# =============================================================================
rules:
  - id: kotlin-no-not-null-assertion
    languages: [generic]
    severity: ERROR
    message: >-
      [Kotlin Null-Safety] The non-null assertion operator ('!!') is forbidden
      in production Kotlin code. Use safe calls ('?.'), elvis ('?:'),
      'requireNotNull(...)', or 'checkNotNull(...)'.
    paths:
      include:
        - "**/*.kt"
      exclude:
        - "**/src/test/**"
        - "**/*Test.kt"
        - "**/*Spec.kt"
    pattern-regex: '[a-zA-Z0-9_)\]}]!!'

  - id: kotlin-no-global-scope
    languages: [generic]
    severity: ERROR
    message: >-
      [Kotlin Coroutines] 'GlobalScope' is forbidden. Use structured concurrency
      with an explicit 'CoroutineScope' and injected 'CoroutineDispatcher'.
    paths:
      include:
        - "**/*.kt"
    pattern-regex: '\bGlobalScope\s*\.'

  - id: kotlin-no-wildcard-import
    languages: [generic]
    severity: ERROR
    message: >-
      [Kotlin Style] Wildcard imports ('import ...*') are forbidden by Detekt.
      Import explicit symbols.
    paths:
      include:
        - "**/*.kt"
    pattern-regex: '^\s*import\s+[a-zA-Z0-9_.]+\.\*\s*$'

  - id: kotlin-no-raw-println
    languages: [generic]
    severity: ERROR
    message: >-
      [Kotlin Hygiene] Direct 'println(...)' or 'print(...)' calls are forbidden
      in src/main/. Use SLF4J Logger (LoggerFactory.getLogger / LogUtils.getLogger).
    paths:
      include:
        - "**/src/main/**/*.kt"
    pattern-regex: '\b(println|print)\s*\('
