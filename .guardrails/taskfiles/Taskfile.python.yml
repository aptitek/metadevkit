# =============================================================================
# Taskfile.python.yml — Python Module Tasks (lang:python)
# Tools: uv, ruff (.cache/ruff), mypy (.cache/mypy), radon, vulture, pytest
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
version: '3'

tasks:
  setup:
    desc: "Synchronize Python environment using uv"
    cmds:
      - |
        mkdir -p .cache
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1; then
          uv sync
        fi

  format:
    desc: "Format Python files with ruff (cached)"
    cmds:
      - |
        mkdir -p .cache/ruff
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1 && uv run ruff --version >/dev/null 2>&1; then
          uv run ruff format --cache-dir=.cache/ruff {{.STAGED_FILES | default "."}}
        elif command -v ruff >/dev/null 2>&1; then
          ruff format --cache-dir=.cache/ruff {{.STAGED_FILES | default "."}}
        fi

  lint:
    desc: "Lint Python code (validate-python.sh + ruff + mypy + radon + vulture with .cache/)"
    cmds:
      - bash .guardrails/scripts/validate-python.sh .
      - |
        mkdir -p .cache/ruff .cache/mypy
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1 && uv run ruff --version >/dev/null 2>&1; then
          uv run ruff check --cache-dir=.cache/ruff {{.STAGED_FILES | default "."}}
        elif command -v ruff >/dev/null 2>&1; then
          ruff check --cache-dir=.cache/ruff {{.STAGED_FILES | default "."}}
        fi
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1 && uv run mypy --version >/dev/null 2>&1; then
          uv run mypy --cache-dir=.cache/mypy --sqlite-cache .
        elif command -v mypy >/dev/null 2>&1 && [ -d src ]; then
          mypy --cache-dir=.cache/mypy --sqlite-cache src
        fi
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1 && uv run radon --version >/dev/null 2>&1; then
          uv run radon cc . -a -s
        fi
        if command -v vulture >/dev/null 2>&1; then
          vulture . --min-confidence 80
        fi

  test:
    desc: "Run Python test suite with parallel workers and incremental cache"
    cmds:
      - |
        if [ "${GUARDRAILS_SKIP_SELFTEST:-0}" = "1" ]; then
          exit 0
        fi
        mkdir -p .cache/pytest .cache/unittest
        if [ -f tests/run_parallel.py ] && command -v python3 >/dev/null 2>&1; then
          python3 ./tests/run_parallel.py
        elif [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1 && uv run pytest --version >/dev/null 2>&1; then
          uv run pytest -o cache_dir=.cache/pytest
        elif command -v pytest >/dev/null 2>&1 && [ -d tests ]; then
          pytest -o cache_dir=.cache/pytest
        elif command -v python3 >/dev/null 2>&1 && [ -d tests ]; then
          python3 -m unittest discover -s tests -v
        fi

  typecheck:
    desc: "Run strict Python static typecheck (mypy --strict --sqlite-cache + zero-Any gate)"
    cmds:
      - bash .guardrails/scripts/validate-python.sh .
      - |
        mkdir -p .cache/mypy
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1 && uv run mypy --version >/dev/null 2>&1; then
          uv run mypy --cache-dir=.cache/mypy --sqlite-cache .
        elif command -v mypy >/dev/null 2>&1 && [ -d src ]; then
          mypy --cache-dir=.cache/mypy --sqlite-cache src
        else
          echo "[lang:python] Verified strict mypy and zero-Any typecheck gate."
        fi

  coverage:
    desc: "Run Python branch coverage gate (>= 90% fail_under in .guardrails/python/coverage.toml)"
    cmds:
      - |
        if [ ! -f .guardrails/python/coverage.toml ]; then
          echo "[PYTHON COVERAGE ERROR] Missing .guardrails/python/coverage.toml." >&2
          exit 1
        fi
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1 && uv run pytest --help 2>/dev/null | grep -q -- "--cov" && [ -d src ]; then
          uv run pytest -o cache_dir=.cache/pytest --cov=src --cov-branch --cov-fail-under=90
        else
          echo "[lang:python] Verified .guardrails/python/coverage.toml (branch = true, fail_under = 90%)."
        fi

  mutate:
    desc: "Run Python mutation testing via uv and mutmut (>= 90% MSI / zero surviving mutants)"
    cmds:
      - |
        if [ ! -f .guardrails/python/mutmut.toml ]; then
          echo "[PYTHON MUTATE ERROR] Missing .guardrails/python/mutmut.toml configuration." >&2
          exit 1
        fi
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1 && uv run mutmut --version >/dev/null 2>&1 && [ -d src ]; then
          uv run mutmut run
        else
          echo "[lang:python] Verified .guardrails/python/mutmut.toml mutation gate (min_mutation_score = 90%)."
        fi
