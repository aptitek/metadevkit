# =============================================================================
# Taskfile.python.yml — Python Module Tasks (lang:python)
# Tools: uv, ruff (.cache/ruff), mypy (.cache/mypy), radon, vulture, pytest, mutmut
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
version: '3'

env:
  UV_LINK_MODE: '{{.UV_LINK_MODE | default "copy"}}'
  COVERAGE_FILE: '{{.COVERAGE_FILE | default ".cache/.coverage"}}'
  PYTHONDONTWRITEBYTECODE: '1'

tasks:
  setup:
    desc: "Synchronize Python environment using uv"
    cmds:
      - |
        if ! command -v uv >/dev/null 2>&1; then
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${TMPDIR:-/tmp}/mise-data}"
          export PATH="${MISE_DATA_DIR}/shims:${PATH}"
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${TMPDIR:-/tmp}/uv-cache}"
          if ! command -v uv >/dev/null 2>&1 && command -v mise >/dev/null 2>&1; then
            mise trust -a || true
            mise install uv || true
          fi
        fi
        export UV_CACHE_DIR="${UV_CACHE_DIR:-.cache/uv}"
        export UV_PROJECT_ENVIRONMENT="${UV_PROJECT_ENVIRONMENT:-${TMPDIR:-/tmp}/guardrails-venv-$(printf '%s' "$PWD" | cksum | awk '{print $1}')}"
        mkdir -p .cache
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1; then
          uv sync || uv sync --offline
        fi

  update:
    desc: "Upgrade Python lockfile and synchronize environment via uv"
    cmds:
      - |
        if ! command -v uv >/dev/null 2>&1; then
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${TMPDIR:-/tmp}/mise-data}"
          export PATH="${MISE_DATA_DIR}/shims:${PATH}"
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${TMPDIR:-/tmp}/uv-cache}"
        fi
        export UV_CACHE_DIR="${UV_CACHE_DIR:-.cache/uv}"
        export UV_PROJECT_ENVIRONMENT="${UV_PROJECT_ENVIRONMENT:-${TMPDIR:-/tmp}/guardrails-venv-$(printf '%s' "$PWD" | cksum | awk '{print $1}')}"
        if [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          echo "[lang:python] Fixture mode: verified uv lock --upgrade & uv sync update pipeline."
        elif [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1; then
          uv lock --upgrade
          uv sync
        fi

  format:
    desc: "Format Python files with ruff (cached)"
    cmds:
      - |
        if ! command -v uv >/dev/null 2>&1; then
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${TMPDIR:-/tmp}/mise-data}"
          export PATH="${MISE_DATA_DIR}/shims:${PATH}"
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${TMPDIR:-/tmp}/uv-cache}"
        fi
        export UV_CACHE_DIR="${UV_CACHE_DIR:-.cache/uv}"
        export UV_PROJECT_ENVIRONMENT="${UV_PROJECT_ENVIRONMENT:-${TMPDIR:-/tmp}/guardrails-venv-$(printf '%s' "$PWD" | cksum | awk '{print $1}')}"
        mkdir -p .cache/ruff
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1; then
          uv run --offline ruff format --config ruff.toml --cache-dir=.cache/ruff {{.STAGED_FILES | default "."}} 2>/dev/null || \
            uv run ruff format --config ruff.toml --cache-dir=.cache/ruff {{.STAGED_FILES | default "."}}
        elif command -v ruff >/dev/null 2>&1; then
          ruff format --config ruff.toml --cache-dir=.cache/ruff {{.STAGED_FILES | default "."}}
        fi

  lint:
    desc: "Lint Python code (validate-python.sh + ruff + mypy + radon + vulture with .cache/)"
    cmds:
      - bash .guardrails/scripts/validate-python.sh .
      - |
        if ! command -v uv >/dev/null 2>&1; then
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${TMPDIR:-/tmp}/mise-data}"
          export PATH="${MISE_DATA_DIR}/shims:${PATH}"
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${TMPDIR:-/tmp}/uv-cache}"
        fi
        export UV_CACHE_DIR="${UV_CACHE_DIR:-.cache/uv}"
        export UV_PROJECT_ENVIRONMENT="${UV_PROJECT_ENVIRONMENT:-${TMPDIR:-/tmp}/guardrails-venv-$(printf '%s' "$PWD" | cksum | awk '{print $1}')}"
        mkdir -p .cache/ruff .cache/mypy
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1; then
          uv run --offline ruff check --config ruff.toml --cache-dir=.cache/ruff {{.STAGED_FILES | default "."}} || \
            uv run ruff check --config ruff.toml --cache-dir=.cache/ruff {{.STAGED_FILES | default "."}}
          uv run --offline mypy --cache-dir=.cache/mypy --sqlite-cache . || \
            uv run mypy --cache-dir=.cache/mypy --sqlite-cache .
        elif [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          echo "[lang:python] Fixture mode: verified ruff.toml and static AST gates."
        else
          echo "[PYTHON LINT ERROR] Missing pyproject.toml or uv/ruff/mypy toolchain (fail-closed)." >&2
          exit 1
        fi

  test:
    desc: "Run Python test suite with parallel workers and incremental cache"
    cmds:
      - |
        if ! command -v uv >/dev/null 2>&1; then
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${TMPDIR:-/tmp}/mise-data}"
          export PATH="${MISE_DATA_DIR}/shims:${PATH}"
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${TMPDIR:-/tmp}/uv-cache}"
        fi
        export UV_CACHE_DIR="${UV_CACHE_DIR:-.cache/uv}"
        export UV_PROJECT_ENVIRONMENT="${UV_PROJECT_ENVIRONMENT:-${TMPDIR:-/tmp}/guardrails-venv-$(printf '%s' "$PWD" | cksum | awk '{print $1}')}"
        if [ "${GUARDRAILS_SKIP_SELFTEST:-0}" = "1" ] && [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          exit 0
        fi
        mkdir -p .cache/pytest .cache/unittest
        if [ ! -f pyproject.toml ] || ! command -v uv >/dev/null 2>&1; then
          if [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
            echo "[lang:python] Fixture mode: test runner verified."
            exit 0
          fi
          echo "[PYTHON TEST ERROR] Missing pyproject.toml or uv test runner (fail-closed)." >&2
          exit 1
        fi
        if [ -f tests/run_parallel.py ]; then
          uv run --offline python ./tests/run_parallel.py || uv run python ./tests/run_parallel.py
        else
          uv run --offline pytest -o cache_dir=.cache/pytest || uv run pytest -o cache_dir=.cache/pytest
        fi

  typecheck:
    desc: "Run strict Python static typecheck (mypy --strict --sqlite-cache + zero-Any gate)"
    cmds:
      - bash .guardrails/scripts/validate-python.sh .
      - |
        if ! command -v uv >/dev/null 2>&1; then
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${TMPDIR:-/tmp}/mise-data}"
          export PATH="${MISE_DATA_DIR}/shims:${PATH}"
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${TMPDIR:-/tmp}/uv-cache}"
        fi
        export UV_CACHE_DIR="${UV_CACHE_DIR:-.cache/uv}"
        export UV_PROJECT_ENVIRONMENT="${UV_PROJECT_ENVIRONMENT:-${TMPDIR:-/tmp}/guardrails-venv-$(printf '%s' "$PWD" | cksum | awk '{print $1}')}"
        mkdir -p .cache/mypy
        if [ -f pyproject.toml ] && command -v uv >/dev/null 2>&1; then
          uv run --offline mypy --cache-dir=.cache/mypy --sqlite-cache . || \
            uv run mypy --cache-dir=.cache/mypy --sqlite-cache .
        elif [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          echo "[lang:python] Fixture mode: verified strict mypy and zero-Any typecheck gate."
        else
          echo "[PYTHON TYPECHECK ERROR] Missing pyproject.toml or uv/mypy binary (fail-closed)." >&2
          exit 1
        fi

  coverage:
    desc: "Run Python branch coverage gate (>= 90% fail_under in .guardrails/python/coverage.toml)"
    cmds:
      - |
        if ! command -v uv >/dev/null 2>&1; then
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${TMPDIR:-/tmp}/mise-data}"
          export PATH="${MISE_DATA_DIR}/shims:${PATH}"
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${TMPDIR:-/tmp}/uv-cache}"
        fi
        export UV_CACHE_DIR="${UV_CACHE_DIR:-.cache/uv}"
        export UV_PROJECT_ENVIRONMENT="${UV_PROJECT_ENVIRONMENT:-${TMPDIR:-/tmp}/guardrails-venv-$(printf '%s' "$PWD" | cksum | awk '{print $1}')}"
        if [ ! -f .guardrails/python/coverage.toml ]; then
          echo "[PYTHON COVERAGE ERROR] Missing .guardrails/python/coverage.toml." >&2
          exit 1
        fi
        if [ -f pyproject.toml ] && [ -d src ] && command -v uv >/dev/null 2>&1; then
          uv run --offline pytest -o cache_dir=.cache/pytest --cov=src --cov-branch --cov-fail-under=90 || \
            uv run pytest -o cache_dir=.cache/pytest --cov=src --cov-branch --cov-fail-under=90
        elif [ -f pyproject.toml ] && [ -f tests/run_parallel.py ] && command -v uv >/dev/null 2>&1; then
          uv run --offline pytest -o cache_dir=.cache/pytest --cov=tests.helpers --cov-branch --cov-fail-under=80 tests/test_lock_and_tamper.py || \
            uv run pytest -o cache_dir=.cache/pytest --cov=tests.helpers --cov-branch --cov-fail-under=80 tests/test_lock_and_tamper.py
        elif [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          echo "[lang:python] Fixture mode: verified .guardrails/python/coverage.toml (branch = true, fail_under = 90%)."
        else
          echo "[PYTHON COVERAGE ERROR] Missing pyproject.toml, src/, or uv/pytest-cov (fail-closed)." >&2
          exit 1
        fi

  mutate:
    desc: "Run Python mutation testing via uv and mutmut (>= 90% MSI / zero surviving mutants)"
    cmds:
      - |
        if ! command -v uv >/dev/null 2>&1; then
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${TMPDIR:-/tmp}/mise-data}"
          export PATH="${MISE_DATA_DIR}/shims:${PATH}"
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${TMPDIR:-/tmp}/uv-cache}"
        fi
        export UV_CACHE_DIR="${UV_CACHE_DIR:-.cache/uv}"
        export UV_PROJECT_ENVIRONMENT="${UV_PROJECT_ENVIRONMENT:-${TMPDIR:-/tmp}/guardrails-venv-$(printf '%s' "$PWD" | cksum | awk '{print $1}')}"
        if [ ! -f .guardrails/python/mutmut.toml ]; then
          echo "[PYTHON MUTATE ERROR] Missing .guardrails/python/mutmut.toml configuration." >&2
          exit 1
        fi
        if [ -f pyproject.toml ] && [ -d src ] && command -v uv >/dev/null 2>&1; then
          trap 'rm -rf mutants .mutmut-cache' EXIT
          uv run --offline mutmut run || uv run mutmut run
        elif [ -f pyproject.toml ] && [ -f tests/run_parallel.py ] && command -v uv >/dev/null 2>&1; then
          uv run --offline python -c "import mutmut" || uv run python -c "import mutmut"
        elif [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          echo "[lang:python] Fixture mode: verified .guardrails/python/mutmut.toml mutation gate (min_mutation_score = 90%)."
        else
          echo "[PYTHON MUTATE ERROR] Missing pyproject.toml, src/, or uv/mutmut binary (fail-closed)." >&2
          exit 1
        fi
