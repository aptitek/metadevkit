# =============================================================================
# polyglot-guardrails — Copier Template Configuration
# Single Source of Truth for initializing & converting polyglot repositories
# =============================================================================
_min_copier_version: "9.0.0"
_subdirectory: "."
_exclude:
  - ".git"
  - ".cache"
  - ".task"
  - ".venv"
  - "venv"
  - ".guardrails"
  - ".guardrails.lock"
  - ".agents"
  - "pyproject.toml"
  - "uv.lock"
  - "ruff.toml"
  - "mise.toml"
  - "lefthook.yml"
  - "AGENTS.md"
  - ".gitignore"
  - "copier.yml"
  - "README.md"
  - "modules"
  - "scripts"
  - "tests"
  - "Taskfile.yml"

project_name:
  type: str
  help: "Project name (kebab-case)"
  default: "my-polyglot-app"

primary_language:
  type: str
  help: "Primary language module (lang:<language>)"
  choices:
    "TypeScript (pnpm, strict TS, Lock 1 functional purity, ESLint Flat, Knip, DepCruiser, Vitest 95%)": "lang:ts"
    "Kotlin 2.x (Gradle Kotlin DSL, Detekt maxIssues:0, Kotest, Coroutines, JaCoCo, PITest)": "lang:kotlin"
    "Java 21 (Gradle, Spotless, Checkstyle, PMD, JUnit 5, JaCoCo, PITest)": "lang:java"
    "Python 3.12+ (uv, Ruff McCabe <= 8, max 256 lines/file, MyPy strict, Pytest, mutmut)": "lang:python"
    "PHP 8.3+ (composer, pint, phpstan level max, pest, Infection PHP)": "lang:php"
    "Shell / Bash (shellcheck, shfmt, bash -n, set -euo pipefail, zero eval)": "lang:shell"
  default: "lang:ts"

framework_ts:
  type: str
  help: "TypeScript framework module (fw:<framework>)"
  when: "{{ primary_language == 'lang:ts' }}"
  choices:
    "None (Pure TypeScript module)": "none"
    "React (Lock 2 i18n, Lock 4 Atomic Purity, WCAG 2.2 AA a11y, max 150 lines)": "fw:react"
    "React Router (inherits fw:react + route parsimony, loaders/actions)": "fw:react-router"
    "Astro (astro check, island architecture & a11y rules)": "fw:astro"
  default: "fw:react"

framework_jvm:
  type: str
  help: "JVM / Minecraft framework module (fw:<framework>)"
  when: "{{ primary_language in ['lang:kotlin', 'lang:java'] }}"
  choices:
    "None (Pure JVM module)": "none"
    "Minecraft Base (fw:minecraft — Side separation, Mixin safety, GameTest, 1.21+ assets)": "fw:minecraft"
    "Quilt MC (fw:quilt — inherits fw:minecraft + Quilt Loom, quilt.mod.json, QKL)": "fw:quilt"
    "Fabric MC (fw:fabric — inherits fw:minecraft + Fabric Loom, fabric.mod.json, Fabric API)": "fw:fabric"
    "Quilt + Fabric Dual-Loader (fw:quilt,fw:fabric)": "fw:quilt,fw:fabric"
  default: "fw:quilt"

fw_fabric_companion:
  type: bool
  help: "Also enable fw:fabric alongside fw:quilt (dual-loader setup)?"
  when: "{{ primary_language in ['lang:kotlin', 'lang:java'] and framework_jvm == 'fw:quilt' }}"
  default: false

framework_python:
  type: str
  help: "Python primary UI / Web framework (fw:<framework>)"
  when: "{{ primary_language == 'lang:python' }}"
  choices:
    "None (Pure Python module)": "none"
    "Flet MD3 (fw:flet — Flutter for Python, Material Design 3 tokens, 5-level Atomic Design)": "fw:flet"
    "NiceGUI (fw:nicegui — Reactive FastAPI/Vue Python UI, non-blocking async gates, User testing)": "fw:nicegui"
    "Django 5.x+ (fw:django — Services/Selectors, Ruff DJ001/DJ008/DJ012, djLint, django-stubs, pytest-django)": "fw:django"
  default: "none"

fw_nicegui_companion:
  type: bool
  help: "Combine fw:nicegui alongside the selected Python framework?"
  when: "{{ primary_language == 'lang:python' and framework_python not in ['none', 'fw:nicegui'] }}"
  default: false

fw_langchain:
  type: bool
  help: "Enable fw:langchain (LangChain LCEL, LangGraph StateGraph, Gemini, MCP, SecretStr)?"
  when: "{{ primary_language == 'lang:python' }}"
  default: false

fw_jupyter:
  type: bool
  help: "Enable fw:jupyter (Jupyter Lab / Notebook — uv reproducible notebooks, output stripping, nbmake)?"
  when: "{{ primary_language == 'lang:python' }}"
  default: false

framework_php:
  type: str
  help: "PHP framework module (fw:<framework>)"
  when: "{{ primary_language == 'lang:php' }}"
  choices:
    "None (Pure PHP module)": "none"
    "Symfony 7.x+ (fw:symfony — Deptrac Hexagonal layers, Twig-CS-Fixer, PHPStan Symfony+Doctrine, Infection)": "fw:symfony"
  default: "fw:symfony"

addon_design_system:
  type: bool
  help: "Enable addon:design-system (Lock 3 M3 Token Purity + Lock 5 Panda CSS Recipes & Deduplication)?"
  when: "{{ primary_language == 'lang:ts' }}"
  default: true

addon_testing_fortress:
  type: bool
  help: "Enable addon:testing-fortress (Polyglot Lock 6 Test Assertion Purity, 1:1 TDD companions, cross-language mutation testing)?"
  default: true

addon_docker:
  type: bool
  help: "Enable addon:docker (Dockerfile & Compose hardening, pinned image tags, non-root USER, healthchecks)?"
  default: false

addon_ffmpeg:
  type: bool
  help: "Enable addon:ffmpeg (FFmpeg audio/video pipeline safety, explicit array args, EBU R128 loudnorm)?"
  default: false

addon_ui_guardrails:
  type: bool
  help: "Enable addon:ui-guardrails (Cross-language 100% locale JSON key parity & WCAG 2.2 AA / UI accessibility)?"
  default: false

addon_storybook:
  type: bool
  help: "Enable addon:storybook (100% CSF3 .stories.tsx coverage & CSF3 AST enforcement)?"
  when: "{{ primary_language == 'lang:ts' and framework_ts in ['fw:react', 'fw:react-router'] }}"
  default: true

addon_content_md:
  type: bool
  help: "Enable addon:content-md (Markdown structural purity, zero-styling MDX, course/simulation registries)?"
  when: "{{ primary_language == 'lang:ts' }}"
  default: false

addon_cloudflare:
  type: bool
  help: "Enable addon:cloudflare (Wrangler, cloudflared, D1/R2/Workers AST rules)?"
  default: false

addon_drizzle_d1:
  type: bool
  help: "Enable addon:drizzle-d1 (Drizzle ORM + Cloudflare D1 SQLite migrations)?"
  when: "{{ addon_cloudflare and primary_language == 'lang:ts' }}"
  default: false

addon_lib_exports:
  type: bool
  help: "Enable addon:lib-exports (Explicit named barrel exports in src/index.ts & package.json exports check)?"
  when: "{{ primary_language == 'lang:ts' }}"
  default: false

master_source:
  type: str
  help: "Master polyglot-guardrails source URL or local filesystem path"
  default: "{{ _copier_conf.src_path }}"

_tasks:
  - >-
    bash "{{ _copier_conf.src_path }}/modules/core/files/.guardrails/scripts/guardrails-cli.sh" init
    --target "."
    --source "{{ master_source }}"
    --modules "core,{{ primary_language }}{% if primary_language == 'lang:ts' and framework_ts != 'none' %},{{ framework_ts }}{% endif %}{% if primary_language in ['lang:kotlin', 'lang:java'] and framework_jvm != 'none' %},{{ framework_jvm }}{% endif %}{% if fw_fabric_companion %},fw:fabric{% endif %}{% if primary_language == 'lang:python' and framework_python != 'none' %},{{ framework_python }}{% endif %}{% if fw_nicegui_companion %},fw:nicegui{% endif %}{% if fw_langchain %},fw:langchain{% endif %}{% if fw_jupyter %},fw:jupyter{% endif %}{% if primary_language == 'lang:php' and framework_php != 'none' %},{{ framework_php }}{% endif %}{% if addon_design_system %},addon:design-system{% endif %}{% if addon_testing_fortress %},addon:testing-fortress{% endif %}{% if addon_docker %},addon:docker{% endif %}{% if addon_ffmpeg %},addon:ffmpeg{% endif %}{% if addon_ui_guardrails %},addon:ui-guardrails{% endif %}{% if addon_storybook %},addon:storybook{% endif %}{% if addon_content_md %},addon:content-md{% endif %}{% if addon_cloudflare %},addon:cloudflare{% endif %}{% if addon_drizzle_d1 %},addon:drizzle-d1{% endif %}{% if addon_lib_exports %},addon:lib-exports{% endif %}"
