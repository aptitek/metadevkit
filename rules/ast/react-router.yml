# =============================================================================
# polyglot-guardrails — React Router v7 AST Guardrails (Semgrep)
# Enforces separation of read (loader) and write (action) concerns
# =============================================================================
rules:
  - id: guardrails-react-router-no-mutation-in-loader
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [React Router Architecture] Side-effect mutations (.insert, .update, .delete,
      method: 'POST'|'PUT'|'DELETE') are forbidden inside 'loader'. Use 'action' for mutations.
    patterns:
      - pattern-inside: |
          export async function loader(...) {
            ...
          }
      - pattern-either:
          - pattern: $DB.insert(...)
          - pattern: $DB.update(...)
          - pattern: $DB.delete(...)
          - pattern: fetch($URL, { ..., method: "POST", ... })
          - pattern: fetch($URL, { ..., method: "DELETE", ... })

  - id: guardrails-react-router-no-window-in-server-loader
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [React Router Architecture] Accessing browser 'window' or 'document' inside
      server 'loader' or 'action' is forbidden. Use 'clientLoader' or React hooks.
    patterns:
      - pattern-either:
          - pattern-inside: |
              export async function loader(...) {
                ...
              }
          - pattern-inside: |
              export async function action(...) {
                ...
              }
      - pattern-either:
          - pattern: window.$PROP
          - pattern: document.$PROP
