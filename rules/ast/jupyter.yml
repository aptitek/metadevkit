# =============================================================================
# jupyter.yml — Semgrep AST Rules for Jupyter / Data Science Projects (fw:jupyter)
# Enforces:
#   - Zero get_ipython().system('pip install ...') / magic package installs
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
rules:
  - id: guardrails-jupyter-no-ipython-system-pip
    patterns:
      - pattern-either:
          - pattern: get_ipython().system("... pip install ...")
          - pattern: get_ipython().run_line_magic("pip", ...)
          - pattern: get_ipython().run_line_magic("conda", ...)
    message: >
      [GUARDRAILS AST] Installing packages dynamically inside notebooks via pip/conda magic
      breaks reproducibility. Use 'uv add <pkg>' so dependencies are locked in uv.lock.
    languages: [python]
    severity: ERROR
