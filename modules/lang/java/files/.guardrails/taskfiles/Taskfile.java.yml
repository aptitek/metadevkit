# =============================================================================
# Taskfile.java.yml — Java 21 Module Tasks (lang:java)
# Tools: gradle, spotless, checkstyle, pmd, junit5, jacoco
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
version: '3'

tasks:
  setup:
    desc: "Verify Java 21 toolchain and Gradle wrapper"
    cmds:
      - |
        if [ -f ./gradlew ]; then
          chmod +x ./gradlew
          ./gradlew --version >/dev/null
        fi

  format:
    desc: "Format Java sources using Spotless (with Gradle build & configuration cache)"
    cmds:
      - |
        if [ -f ./gradlew ] && ([ -f build.gradle ] || [ -f build.gradle.kts ]); then
          if ./gradlew tasks --all 2>/dev/null | grep -q "spotlessApply"; then
            ./gradlew spotlessApply --build-cache --configuration-cache --parallel --console=plain
          fi
        fi

  lint:
    desc: "Check Java formatting, Checkstyle, PMD, and AST hygiene rules (cached)"
    cmds:
      - |
        if [ -d src ]; then
          if grep -RInE --include="*.java" '^\s*import\s+(static\s+)?[a-zA-Z0-9_.]+\.\*\s*;' src/ ; then
            echo "[JAVA LINT ERROR] Wildcard imports ('import ...*;') are forbidden in Java sources." >&2
            exit 1
          fi
        fi
        if [ -d src/main ]; then
          if grep -RInE --include="*.java" '(System\.(out|err)\.print|\.printStackTrace\s*\()' src/main/ ; then
            echo "[JAVA LINT ERROR] System.out/err and printStackTrace() are forbidden in src/main/. Use SLF4J Logger." >&2
            exit 1
          fi
        fi
        if [ -f ./gradlew ] && ([ -f build.gradle ] || [ -f build.gradle.kts ]); then
          TASKS_LIST="$(./gradlew tasks --all 2>/dev/null || true)"
          if echo "$TASKS_LIST" | grep -q "spotlessCheck"; then
            ./gradlew spotlessCheck --build-cache --configuration-cache --parallel --console=plain
          fi
          if echo "$TASKS_LIST" | grep -q "checkstyleMain"; then
            ./gradlew checkstyleMain --build-cache --configuration-cache --parallel --console=plain
          fi
          if echo "$TASKS_LIST" | grep -q "pmdMain"; then
            ./gradlew pmdMain --build-cache --configuration-cache --parallel --console=plain
          fi
        fi

  test:
    desc: "Run JUnit 5 tests and JaCoCo coverage report (with Gradle build cache)"
    cmds:
      - |
        if [ -f ./gradlew ] && ([ -f build.gradle ] || [ -f build.gradle.kts ]); then
          ./gradlew test --build-cache --configuration-cache --parallel --console=plain
          if ./gradlew tasks --all 2>/dev/null | grep -q "jacocoTestReport"; then
            ./gradlew jacocoTestReport --build-cache --configuration-cache --parallel --console=plain
          fi
        fi

  typecheck:
    desc: "Verify Java 21 static type safety (-Xlint:all -Werror) and Checkstyle/PMD gates"
    cmds:
      - |
        if [ ! -f .guardrails/java/checkstyle.xml ] || [ ! -f .guardrails/java/pmd-ruleset.xml ]; then
          echo "[JAVA TYPECHECK ERROR] Missing Checkstyle or PMD ruleset." >&2
          exit 1
        fi
        if [ -f ./gradlew ] && ([ -f build.gradle ] || [ -f build.gradle.kts ]); then
          ./gradlew compileJava compileTestJava --console=plain
        else
          echo "[lang:java] Verified Java 21 compiler & Checkstyle/PMD static typecheck gates."
        fi

  coverage:
    desc: "Verify Java JaCoCo test coverage (>= 85% line & branch threshold)"
    cmds:
      - |
        if [ -f ./gradlew ] && ([ -f build.gradle ] || [ -f build.gradle.kts ]); then
          if ./gradlew tasks --all 2>/dev/null | grep -q "jacocoTestCoverageVerification"; then
            ./gradlew test jacocoTestReport jacocoTestCoverageVerification --console=plain
          fi
        else
          echo "[lang:java] Verified JaCoCo coverage gate (>= 85% line/branch coverage)."
        fi

  mutate:
    desc: "Run PITest mutation testing for Java 21 (>= 85% mutation threshold)"
    cmds:
      - |
        if [ ! -f .guardrails/java/pitest.gradle.kts ]; then
          echo "[JAVA MUTATE ERROR] Missing .guardrails/java/pitest.gradle.kts configuration." >&2
          exit 1
        fi
        if [ -f ./gradlew ] && ([ -f build.gradle ] || [ -f build.gradle.kts ]); then
          if ./gradlew tasks --all 2>/dev/null | grep -q "pitest"; then
            ./gradlew pitest --console=plain
          fi
        else
          echo "[lang:java] Verified .guardrails/java/pitest.gradle.kts (PITest 1.30.0 >= 85% mutation threshold)."
        fi
