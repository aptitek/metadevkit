# =============================================================================
# Taskfile.php.yml — PHP Module Tasks (lang:php)
# Tools: composer, pint, phpstan, pest, infection
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
version: '3'

tasks:
  setup:
    desc: "Install Composer dependencies"
    cmds:
      - |
        if [ -f composer.json ] && command -v composer >/dev/null 2>&1; then
          composer install --no-interaction --prefer-dist
        fi

  format:
    desc: "Format PHP sources using Laravel Pint (with .cache/pint.json)"
    cmds:
      - |
        mkdir -p .cache
        if [ -x ./vendor/bin/pint ]; then
          ./vendor/bin/pint --config pint.json --cache-file=.cache/pint.json {{.STAGED_FILES}}
        fi

  lint:
    desc: "Verify strict_types=1, formatting with Pint (cached), and static analysis with PHPStan (cached)"
    cmds:
      - bash .guardrails/scripts/validate-php.sh .
      - |
        mkdir -p .cache/phpstan
        if [ -f composer.json ] && [ -x ./vendor/bin/pint ] && [ -x ./vendor/bin/phpstan ]; then
          ./vendor/bin/pint --test --config pint.json --cache-file=.cache/pint.json
          ./vendor/bin/phpstan analyse --configuration=phpstan.neon.dist
        elif [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          echo "[lang:php] Fixture mode: verified pint.json, phpstan.neon.dist, and declare(strict_types=1)."
        else
          echo "[PHP LINT ERROR] Missing composer.json, ./vendor/bin/pint, or ./vendor/bin/phpstan (fail-closed)." >&2
          exit 1
        fi

  typecheck:
    desc: "Verify PHP strict_types=1 and PHPStan level max static analysis (cached)"
    cmds:
      - bash .guardrails/scripts/validate-php.sh .
      - |
        mkdir -p .cache/phpstan
        if [ ! -f phpstan.neon.dist ]; then
          echo "[PHP TYPECHECK ERROR] Missing locked phpstan.neon.dist." >&2
          exit 1
        fi
        if [ -f composer.json ] && [ -x ./vendor/bin/phpstan ]; then
          ./vendor/bin/phpstan analyse --configuration=phpstan.neon.dist
        elif [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          echo "[lang:php] Fixture mode: verified phpstan.neon.dist (level: max) & declare(strict_types=1)."
        else
          echo "[PHP TYPECHECK ERROR] Missing composer.json or ./vendor/bin/phpstan (fail-closed)." >&2
          exit 1
        fi

  test:
    desc: "Run Pest tests with minimum 85% coverage (parallel + cached)"
    cmds:
      - |
        mkdir -p .cache/phpunit
        if [ -f composer.json ] && [ -x ./vendor/bin/pest ]; then
          ./vendor/bin/pest --parallel --cache-directory=.cache/phpunit --coverage --min=85
        elif [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          echo "[lang:php] Fixture mode: verified Pest test runner gate."
        else
          echo "[PHP TEST ERROR] Missing composer.json or ./vendor/bin/pest (fail-closed)." >&2
          exit 1
        fi

  coverage:
    desc: "Verify Pest code coverage gate (>= 85% threshold)"
    cmds:
      - |
        if [ -f composer.json ] && [ -x ./vendor/bin/pest ]; then
          ./vendor/bin/pest --coverage --min=85
        elif [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          echo "[lang:php] Fixture mode: verified Pest coverage gate (--coverage --min=85)."
        else
          echo "[PHP COVERAGE ERROR] Missing composer.json or ./vendor/bin/pest (fail-closed)." >&2
          exit 1
        fi

  mutate:
    desc: "Run Infection PHP mutation testing with PHPStan static analysis (minMsi >= 85%, minCoveredMsi >= 90%)"
    cmds:
      - |
        if [ ! -f infection.json5 ]; then
          echo "[PHP MUTATE ERROR] Missing locked infection.json5 configuration." >&2
          exit 1
        fi
        if [ -f composer.json ] && [ -x ./vendor/bin/infection ]; then
          XDEBUG_MODE=coverage ./vendor/bin/infection --configuration=infection.json5 --threads=max --min-msi=85 --min-covered-msi=90
        elif [ "${GUARDRAILS_FIXTURE_MODE:-0}" = "1" ]; then
          echo "[lang:php] Fixture mode: verified infection.json5 (minMsi: 85%, minCoveredMsi: 90%, staticAnalysisTool: phpstan)."
        else
          echo "[PHP MUTATE ERROR] Missing composer.json or ./vendor/bin/infection (fail-closed)." >&2
          exit 1
        fi
