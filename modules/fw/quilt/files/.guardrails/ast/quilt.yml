# =============================================================================
# polyglot-guardrails — Quilt MC AST & Side Boundary Rules (fw:quilt)
# =============================================================================
rules:
  - id: quilt-no-client-entrypoint-on-server
    languages: [generic]
    severity: ERROR
    message: >-
      [Quilt Side Separation] Server/common packages must NEVER import
      'org.quiltmc.qsl.base.api.entrypoint.client.*'.
    paths:
      include:
        - "**/server/**/*.java"
        - "**/server/**/*.kt"
        - "**/common/**/*.java"
        - "**/common/**/*.kt"
    pattern-regex: '^\s*import\s+org\.quiltmc\.qsl\.base\.api\.entrypoint\.client\.'

  - id: quilt-no-server-entrypoint-on-client
    languages: [generic]
    severity: ERROR
    message: >-
      [Quilt Side Separation] Client packages must NEVER import
      'org.quiltmc.qsl.base.api.entrypoint.server.*'.
    paths:
      include:
        - "**/client/**/*.java"
        - "**/client/**/*.kt"
    pattern-regex: '^\s*import\s+org\.quiltmc\.qsl\.base\.api\.entrypoint\.server\.'
