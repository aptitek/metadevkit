# =============================================================================
# langchain.yml — Semgrep AST Rules for LangChain & LangGraph Projects (fw:langchain)
# Enforces Geranium AI Orchestration Gates:
#   - Zero legacy LLMChain / SequentialChain / initialize_agent (use LCEL | or StateGraph)
#   - Zero hardcoded API key string literals in LLM constructors (use SecretStr)
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
rules:
  - id: guardrails-langchain-no-legacy-chains
    patterns:
      - pattern-either:
          - pattern: LLMChain(...)
          - pattern: SequentialChain(...)
          - pattern: SimpleSequentialChain(...)
          - pattern: ConversationChain(...)
          - pattern: initialize_agent(...)
    message: >
      [GUARDRAILS AST] Legacy LangChain chains (LLMChain, SequentialChain, ConversationChain,
      initialize_agent) are deprecated and forbidden. Use modern LCEL pipe composition
      (prompt | model | parser) or LangGraph StateGraph.
    languages: [python]
    severity: ERROR

  - id: guardrails-langchain-no-hardcoded-api-key
    patterns:
      - pattern-either:
          - pattern: ChatGoogleGenerativeAI(..., google_api_key="...", ...)
          - pattern: ChatGoogleGenerativeAI(..., api_key="...", ...)
          - pattern: ChatOpenAI(..., api_key="...", ...)
    message: >
      [GUARDRAILS AST] Hardcoded API key string literal in LLM constructor. Inject keys
      via pydantic-settings SecretStr (settings.gemini_api_key.get_secret_value()).
    languages: [python]
    severity: ERROR
