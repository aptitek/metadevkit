# =============================================================================
# ruff.toml — Strict Python + Django Linter Configuration (fw:django)
# Extends .guardrails/python/ruff.base.toml with flake8-django (DJ001, DJ008, DJ012)
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
