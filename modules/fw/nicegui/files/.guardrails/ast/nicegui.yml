# =============================================================================
# nicegui.yml — Semgrep AST Rules for NiceGUI Reactive UI Projects (fw:nicegui)
# Enforces:
#   - Zero blocking time.sleep() on the FastAPI/Uvicorn asyncio event loop
#   - Zero synchronous requests.* HTTP calls on the event loop
#   - ui.run() restricted exclusively to main.py entrypoint
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
rules:
  - id: guardrails-nicegui-no-blocking-time-sleep
    pattern: time.sleep(...)
    paths:
      include:
        - "src/**/*.py"
        - "*/src/**/*.py"
    message: >
      [GUARDRAILS AST] Blocking time.sleep() freezes the NiceGUI FastAPI/Uvicorn event loop
      for all connected clients. Use 'await asyncio.sleep(...)' or 'await run.io_bound(...)'.
    languages: [python]
    severity: ERROR

  - id: guardrails-nicegui-no-blocking-requests
    patterns:
      - pattern-either:
          - pattern: requests.get(...)
          - pattern: requests.post(...)
          - pattern: requests.put(...)
          - pattern: requests.delete(...)
          - pattern: requests.patch(...)
    paths:
      include:
        - "src/**/*.py"
        - "*/src/**/*.py"
    message: >
      [GUARDRAILS AST] Synchronous requests.* HTTP calls block the NiceGUI asyncio event loop.
      Use 'httpx.AsyncClient' or offload via 'await nicegui.run.io_bound(...)'.
    languages: [python]
    severity: ERROR
