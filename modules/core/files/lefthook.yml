# =============================================================================
# lefthook.yml — Git Hooks Guardrails (core)
# Enforces Commitlint (ARCHITECTURAL_SCOPES), Config Lock, TDD Staged Check,
# Staged Formatting/Linting/Complexity, and Pre-Push Full Verification.
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
commit-msg:
  commands:
    commitlint:
      run: |
        MSG_FILE="{1}"
        if [ -f "$MSG_FILE" ]; then
          HEADER=$(head -n 1 "$MSG_FILE")
          if ! echo "$HEADER" | grep -E -q '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\((ui|tokens|routes|db|i18n|ci|lint|theme|worker|test|docs|deps|config|security|a11y|storybook)\): .{15,85}$'; then
            echo "[COMMITLINT ERROR] Commit message must match '<type>(<scope>): <subject (>= 15 chars)>' with an allowed architectural scope." >&2
            exit 1
          fi
        fi

pre-commit:
  parallel: false
  commands:
    guard-check:
      run: $(command -v task || command -v go-task) guard:check
    format-and-lint:
      run: $(command -v task || command -v go-task) format lint STAGED_FILES="{staged_files}"
    complexity:
      run: $(command -v task || command -v go-task) complexity STAGED_FILES="{staged_files}"

pre-push:
  parallel: false
  commands:
    verify:
      run: $(command -v task || command -v go-task) verify
