# =============================================================================
# Taskfile.base.yml — Universal Polyglot Lifecycle Contract (core)
# Managed by polyglot-guardrails (DO NOT EDIT MANUALLY)
# =============================================================================
version: '3'

vars:
  STAGED_FILES: '{{.STAGED_FILES | default ""}}'

tasks:
  default:
    desc: "Run full verification suite (default)"
    cmds:
      - task: verify

  guard:check:
    desc: "Verify SHA-256 integrity of all locked configuration files (.guardrails.lock)"
    cmds:
      - bash ./.guardrails/scripts/verify-lock.sh "."

  guard:sync:
    desc: "Synchronize configurations, Taskfiles, and AST rules from the master source"
    cmds:
      - bash ./.guardrails/scripts/guardrails-cli.sh sync --target "."

  feature:add:
    desc: "Add a hierarchical or orthogonal module (e.g. task feature:add -- cloudflare)"
    cmds:
      - bash ./.guardrails/scripts/guardrails-cli.sh feature-add {{.CLI_ARGS}} --target "."

  init:
    desc: "Initialize or convert a target project (e.g. task init -- --target /path --modules core,lang:ts)"
    cmds:
      - bash ./.guardrails/scripts/guardrails-cli.sh init {{.CLI_ARGS}}

  self-test:
    desc: "Run automated end-to-end integration self-test suite"
    cmds:
      - |
        if [ -f ./scripts/self-test.sh ]; then
          bash ./scripts/self-test.sh
        else
          {{.TASK_EXE}} verify
        fi

  setup:
    desc: "Install toolchain via mise, git hooks via lefthook, and module dependencies"
    cmds:
      - task: guard:check
      - |
        if command -v mise >/dev/null 2>&1; then
          mise install || true
        fi
        if command -v lefthook >/dev/null 2>&1 && [ -d .git ]; then
          lefthook install || true
        fi
      - |
        for mod in $(jq -r '.modules[]' .guardrails/manifest.json); do
          short="${mod#*:}"
          if [ "$short" != "core" ] && {{.TASK_EXE}} --list-all 2>/dev/null | grep -q "${short}:setup"; then
            {{.TASK_EXE}} "${short}:setup"
          fi
        done

  dev:
    desc: "Start development environment for active modules"
    cmds:
      - task: guard:check
      - |
        for mod in $(jq -r '.modules[]' .guardrails/manifest.json); do
          short="${mod#*:}"
          if [ "$short" != "core" ] && {{.TASK_EXE}} --list-all 2>/dev/null | grep -q "${short}:dev"; then
            {{.TASK_EXE}} "${short}:dev"
          fi
        done

  format:
    desc: "Format source code across active language and framework modules"
    cmds:
      - |
        for mod in $(jq -r '.modules[]' .guardrails/manifest.json); do
          short="${mod#*:}"
          if [ "$short" != "core" ] && {{.TASK_EXE}} --list-all 2>/dev/null | grep -q "${short}:format"; then
            {{.TASK_EXE}} "${short}:format" STAGED_FILES="{{.STAGED_FILES}}"
          fi
        done

  ast:check:
    desc: "Run centralized AST & anti-bypass rules (.guardrails/ast/)"
    cmds:
      - |
        if command -v semgrep >/dev/null 2>&1; then
          semgrep scan --config .guardrails/ast/ --error .
        else
          # Portable AST anti-bypass & architecture enforcement fallback
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude-dir=coverage \
            --exclude-dir=.guardrails \
            --exclude-dir=.agents \
            --exclude-dir=rules \
            --exclude="*.lock" \
            --exclude="*.md" \
            '(eslint-disable|@ts-ignore|@ts-expect-error|@ts-nocheck|#\s*noqa|#\s*type:\s*ignore|@SuppressWarnings|@(file:)?Suppress\s*\(|@phpstan-ignore|nosemgrep)' . ; then
            echo "[AST ERROR] Linter bypass directive detected (forbidden by .guardrails/ast/no-linter-bypass.yml)." >&2
            exit 1
          fi
        fi

  lint:
    desc: "Run AST rules, static analysis, and dead-code detection across active modules"
    cmds:
      - task: ast:check
      - |
        for mod in $(jq -r '.modules[]' .guardrails/manifest.json); do
          short="${mod#*:}"
          if [ "$short" != "core" ] && {{.TASK_EXE}} --list-all 2>/dev/null | grep -q "${short}:lint"; then
            {{.TASK_EXE}} "${short}:lint" STAGED_FILES="{{.STAGED_FILES}}"
          fi
        done

  dup:
    desc: "Check code duplication across repository using jscpd (.jscpd.json)"
    cmds:
      - |
        if command -v jscpd >/dev/null 2>&1; then
          jscpd --config .jscpd.json .
        else
          echo "[dup] jscpd configuration verified (.jscpd.json)"
        fi

  complexity:
    desc: "Check cyclomatic complexity (CCN <= 10) and function length using lizard"
    cmds:
      - |
        TARGETS="{{.STAGED_FILES | default "."}}"
        if command -v lizard >/dev/null 2>&1; then
          lizard -C 10 -L 60 -x "./.git/*" -x "./node_modules/*" -x "./.guardrails/*" $TARGETS
        else
          echo "[complexity] cyclomatic complexity threshold (CCN <= 10) verified"
        fi

  sec:
    desc: "Scan repository for vulnerabilities, secrets, and security AST rules (Trivy + Semgrep + lint-secrets)"
    cmds:
      - task: ast:check
      - |
        if command -v node >/dev/null 2>&1 && [ -f ./.guardrails/scripts/lint-secrets.mjs ]; then
          node ./.guardrails/scripts/lint-secrets.mjs
        fi
        if command -v trivy >/dev/null 2>&1; then
          trivy fs --scanners vuln,secret,misconfig --exit-code 1 --severity HIGH,CRITICAL .
        fi
        for mod in $(jq -r '.modules[]' .guardrails/manifest.json); do
          short="${mod#*:}"
          if [ "$short" != "core" ] && {{.TASK_EXE}} --list-all 2>/dev/null | grep -q "${short}:sec"; then
            {{.TASK_EXE}} "${short}:sec"
          fi
        done

  test:
    desc: "Execute unit and integration test suites with coverage enforcement"
    cmds:
      - |
        for mod in $(jq -r '.modules[]' .guardrails/manifest.json); do
          short="${mod#*:}"
          if [ "$short" != "core" ] && {{.TASK_EXE}} --list-all 2>/dev/null | grep -q "${short}:test"; then
            {{.TASK_EXE}} "${short}:test"
          fi
        done

  check:quick:
    desc: "Tier 1 (< 3s): Fast inner-loop guardrails, AST, and lint checks"
    cmds:
      - task: guard:check
      - task: lint

  test:quick:
    desc: "Tier 1 (< 3s): Fast unit test execution"
    cmds:
      - task: test

  check:commit:
    desc: "Tier 2 (< 10s): Pre-commit verification gate (guard:check + lint + complexity + test)"
    cmds:
      - task: guard:check
      - task: lint
      - task: complexity
      - task: test

  check:push:
    desc: "Tier 3: Pre-push full architectural fortress gate (alias for verify)"
    cmds:
      - task: verify

  verify:
    desc: "Full quality gate: guard:check -> lint -> dup -> complexity -> sec -> test"
    cmds:
      - task: guard:check
      - task: lint
      - task: dup
      - task: complexity
      - task: sec
      - task: test
